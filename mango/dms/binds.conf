# Mango native defaults (restored — your config.conf had none loaded)
# switch_layout moved to Alt,n to free Super,n for DMS notifications (see below)

# reload config
bind=SUPER,r,reload_config

# menu and terminal (terminal switched to kitty to match your niri setup)
bind=Alt,space,spawn,rofi -show drun
bind=Alt,Return,spawn,kitty

# exit
bind=SUPER,m,quit
bind=ALT,q,killclient,
bind=SUPER,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=SUPER,f,spawn,/home/davidkan/.config/mango/scripts/toggle-proportion.sh
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverview,
bind=SUPER+SHIFT,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=SUPER,minus,spawn,/home/davidkan/.config/mango/scripts/adjust-proportion.sh -0.1
bind=SUPER,equal,spawn,/home/davidkan/.config/mango/scripts/adjust-proportion.sh +0.1
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

# dwindle layout (manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout (moved off Super,n — see DMS section)
bind=ALT,n,switch_layout

# tag switch (mango-native, doubles as niri "workspace" prev/next)
# swapped: Alt+Left/Right = tag switch, Super+Left/Right = window focus
bind=ALT,Left,viewtoleft,0
bind=ALT,Right,viewtoright,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,viewtoleft,0
bind=SUPER,Down,viewtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# niri-parity: Super+1-9 focus tag, Super+Shift+1-9 move-and-follow (matches niri muscle memory)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin (floating)
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin (floating)
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# scroll wheel tag nav
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# 3-finger trackpad swipe: same as Super+Left/Right (focus window in scroller)
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left

# 3-finger swipe up: overview
gesturebind=none,up,3,toggleoverview

# rofi popup animation
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# ── DMS IPC — ported 1:1 from your niri binds, same key combos ──
bind=ALT+CTRL,p,spawn,dms ipc call powermenu toggle
bind=CTRL+SHIFT,Escape,spawn,dms ipc call processlist focusOrToggle
bind=CTRL+SHIFT,r,spawn,dms ipc call workspace-rename open
bind=SUPER+ALT,l,spawn,dms ipc call lock lock
bind=SUPER,comma,spawn,dms ipc call settings focusOrToggle
bind=SUPER,n,spawn,dms ipc call notifications toggle
bind=SUPER+SHIFT,n,spawn,dms ipc call notepad toggle
bind=SUPER+SHIFT,w,spawn,dms ipc call window-rules toggle
bind=SUPER,space,spawn,dms ipc call spotlight toggle
bind=SUPER,v,spawn,dms ipc call clipboard toggle
bind=SUPER,y,spawn,dms ipc call dankdash wallpaper
bind=SUPER+SHIFT,slash,spawn,dms ipc call keybinds toggle
bind=SUPER+SHIFT,p,spawn,dms dpms off

# media / volume keys
bind=NONE,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 3
bind=NONE,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 3
bind=CTRL,XF86AudioRaiseVolume,spawn,dms ipc call mpris increment 3
bind=CTRL,XF86AudioLowerVolume,spawn,dms ipc call mpris decrement 3
bind=NONE,XF86AudioMute,spawn,dms ipc call audio mute
bind=NONE,XF86AudioMicMute,spawn,dms ipc call audio micmute
bind=NONE,XF86AudioNext,spawn,dms ipc call mpris next
bind=NONE,XF86AudioPrev,spawn,dms ipc call mpris previous
bind=NONE,XF86AudioPlay,spawn,dms ipc call mpris playPause
bind=NONE,XF86AudioPause,spawn,dms ipc call mpris playPause
bind=NONE,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 5 ""
bind=NONE,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 5 ""

# ── Screenshots — DMS's own compositor-agnostic screenshot tool ──
bind=ALT,Print,spawn,dms screenshot window
bind=CTRL,Print,spawn,dms screenshot full
bind=NONE,Print,spawn,dms screenshot region
bind=SUPER+SHIFT,s,spawn,dms screenshot region

# ── Your app launches, ported 1:1 ──
bind=SUPER,t,spawn,kitty
bind=SUPER,Return,spawn,kitty
bind=SUPER,a,spawn,pwvucontrol
bind=SUPER,b,spawn,google-chrome-stable
bind=SUPER,e,spawn,nautilus

# secondary quit (native Super+m still works too)
bind=SUPER+SHIFT,e,quit
